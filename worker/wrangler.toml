name = "repfuel-ai"
main = "index.js"
compatibility_date = "2026-10-01"

[vars]
# Sites allowed to call this Worker (comma separated).
ALLOWED_ORIGINS = "https://mahmoudkh123.github.io,http://127.0.0.1:5173"
# Tried in order; the next one is used when a model's free daily limit is used up.
# No web search: on the free tier, Google Search is 0/day for Gemini 3+, and 2.5 is closed to new users.
MODELS = "gemini-3.8-flash,gemini-3.5-flash-lite"

# Secrets (set with `npx wrangler secret put <NAME>`, never written here):
#   GEMINI_API_KEY  - Google AI Studio key, on a project WITHOUT billing so it can only use the free tier
#   PASSCODE        - private passcode, typed once in RepFuel > More
